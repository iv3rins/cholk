<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Chat · 移动端预览</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0c10;
      color: #cfd3d6;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 16px 20px 12px;
    }
    header strong { font-size: 14px; margin-right: 8px; color: #f9fafb; }
    button, a {
      border: 1px solid #353638;
      background: #1b1b1c;
      color: #cfd3d6;
      border-radius: 9px;
      padding: 6px 11px;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }
    button:hover, a:hover { background: #2c2c2e; }
    button.active { border-color: #5686fe; color: #8fb0ff; background: #1c2740; }
    .frame {
      padding: 10px;
      border-radius: 34px;
      background: #000;
      box-shadow: 0 0 0 1px #2c2c2e, 0 24px 60px rgba(0, 0, 0, 0.55);
      margin: 4px 16px 0;
    }
    iframe {
      display: block;
      width: 390px;
      height: 844px;
      border: 0;
      border-radius: 26px;
      background: #151517;
    }
    .note {
      max-width: 560px;
      padding: 14px 20px 28px;
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
      color: #81858c;
    }
  </style>
</head>
<body>
  <header>
    <strong>移动端预览</strong>
    <button data-w="360" data-h="800">360 × 800</button>
    <button data-w="390" data-h="844" class="active">390 × 844</button>
    <button data-w="412" data-h="915">412 × 915</button>
    <button id="reload">重新加载</button>
    <a href="/" target="_blank" rel="noopener">新窗口打开</a>
  </header>

  <div class="frame">
    <iframe id="app" src="/" title="DeepSeek Chat 移动端预览"></iframe>
  </div>

  <p class="note">
    预览页面通过固定宽度的 iframe 模拟手机视口。应用会在宽度小于 900 像素时切换到移动布局，
    因此这里可以直接检查抽屉侧边栏、吸底输入框和消息气泡。示例数据来自本地 mock 上游，
    刷新页面会恢复初始示例。
  </p>

  <script>
    const frame = document.getElementById('app');
    const buttons = Array.from(document.querySelectorAll('button[data-w]'));
    for (const button of buttons) {
      button.addEventListener('click', () => {
        frame.style.width = button.dataset.w + 'px';
        frame.style.height = button.dataset.h + 'px';
        buttons.forEach((item) => item.classList.toggle('active', item === button));
      });
    }
    document.getElementById('reload').addEventListener('click', () => {
      frame.contentWindow.location.reload();
    });
  </script>
</body>
</html>
