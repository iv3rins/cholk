name: Build Android APK

# Pushing a tag such as v1.0.0 builds the APK and publishes a GitHub Release.
# Release notes come from docs/releases/<tag>.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          name="cholk-${GITHUB_REF_NAME}.apk"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then name="cholk-${GITHUB_SHA::7}.apk"; fi
          cp build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Cholk ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: ${{ env.APK_NAME }}
